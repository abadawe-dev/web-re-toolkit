[package]
name = "wre-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A browser surface built from native bindings, so the shapes a protection inspects are real rather than faked in JavaScript"

[dependencies]
wre-behavior.workspace = true
wre-core.workspace = true
wre-live.workspace = true

base64.workspace = true
chrono.workspace = true
encoding_rs = "0.8.35"
# zlib-rs: zlib's own deflate and messages, so CompressionStream output and DecompressionStream
# errors are byte for byte Chrome's (miniz_oxide's are not).
flate2 = { workspace = true, features = ["zlib-rs"] }
hex.workspace = true
rand.workspace = true
regex.workspace = true
aes.workspace = true
aes-gcm = { workspace = true }
cbc = { version = "0.2.1", features = ["alloc"] }
ctr = "0.10.1"
hkdf = "0.13.0"
crc32fast.workspace = true
hmac.workspace = true
p256 = { version = "0.14.0", features = ["ecdsa", "ecdh", "pkcs8"] }
p384 = { version = "0.14.0", features = ["ecdsa", "ecdh", "pkcs8"] }
pbkdf2.workspace = true
sha1.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
url.workspace = true
